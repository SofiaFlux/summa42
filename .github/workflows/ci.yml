name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: go test ./tests/acceptance -count=1 -v
      - run: go test ./... -count=1
      - name: Smoke local bootstrap and control path
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          pid=""
          cleanup() {
            if [[ -n "$pid" ]]; then
              kill -TERM "$pid" 2>/dev/null || true
              wait "$pid" 2>/dev/null || true
            fi
            rm -rf "$tmp"
          }
          trap cleanup EXIT

          go build -o "$tmp/summa42" ./cmd/summa42
          go build -o "$tmp/summa42-box" ./cmd/summa42-box
          export SUMMA42_HOME="$tmp/home"
          export SUMMA42_CONTROL_ENDPOINT="$tmp/control.sock"

          "$tmp/summa42" init
          "$tmp/summa42-box" &
          pid=$!

          for _ in {1..100}; do
            [[ -S "$SUMMA42_CONTROL_ENDPOINT" ]] && break
            kill -0 "$pid" 2>/dev/null
            sleep 0.1
          done
          [[ -S "$SUMMA42_CONTROL_ENDPOINT" ]]
          "$tmp/summa42" status | grep -E '^Collective .+: DORMANT$'

          kill -TERM "$pid"
          wait "$pid"
          pid=""
      - run: go test -race ./... -count=1 -timeout 45m
      - run: go vet ./...
      - run: go build ./cmd/summa42 ./cmd/summa42-box
      - run: python3 docs/superpowers/research/spikes/2026-09-14-sqlite-persistence-spike.py

  oci-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
      - run: docker version
      - run: go test -tags=oci ./internal/teb ./tests/acceptance -run 'TestOCIBypass|TestReviewedFailureSemantics/[Cc]apability' -count=1 -v
