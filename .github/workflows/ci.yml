name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: go test ./tests/acceptance -count=1 -v
      - run: go test ./... -count=1
      - name: Smoke local bootstrap and control path
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          pid=""
          cleanup() {
            if [[ -n "$pid" ]]; then
              kill -TERM "$pid" 2>/dev/null || true
              wait "$pid" 2>/dev/null || true
            fi
            rm -rf "$tmp"
          }
          trap cleanup EXIT

          go build -o "$tmp/summa42" ./cmd/summa42
          go build -o "$tmp/summa42-box" ./cmd/summa42-box
          export SUMMA42_HOME="$tmp/home"
          export SUMMA42_CONTROL_ENDPOINT="$tmp/control.sock"

          "$tmp/summa42" init
          "$tmp/summa42-box" &
          pid=$!

          for _ in {1..100}; do
            [[ -S "$SUMMA42_CONTROL_ENDPOINT" ]] && break
            kill -0 "$pid" 2>/dev/null
            sleep 0.1
          done
          [[ -S "$SUMMA42_CONTROL_ENDPOINT" ]]
          "$tmp/summa42" status | grep -E '^Collective .+: DORMANT$'

          kill -TERM "$pid"
          wait "$pid"
          pid=""
      - run: go test -race ./... -count=1 -timeout 45m
      - run: go vet ./...
      - run: go build ./cmd/summa42 ./cmd/summa42-box
      - run: python3 docs/superpowers/research/spikes/2026-09-14-sqlite-persistence-spike.py

  oci-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
      - run: docker version
      - run: go test -tags=oci ./internal/teb ./tests/acceptance -run 'TestOCIBypass|TestReviewedFailureSemantics/[Cc]apability' -count=1 -v

  # Rule R5 of the development plan: a pull request that changes a protected
  # path needs the Owner. The script and its list of paths come from the base
  # commit, never from the pull request, so a pull request cannot relax its own
  # check. Nothing from the pull request's tree is executed; Git only reads it.
  protected-paths:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out the base commit (trusted copy of the gate)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false
      - name: Check out the pull request head with full history (data only)
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/head
          path: head
          fetch-depth: 0
          persist-credentials: false
      - name: Run the base commit's gate against the head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          gate=base/scripts/check_protected_paths.py
          if [[ ! -f "$gate" ]]; then
            # Only the pull request that introduces the gate reaches this.
            # Afterwards the gate is in every base commit and is itself a
            # protected path, so removing it fails this check.
            echo "::warning::the base commit has no protected path gate yet; nothing was checked"
            exit 0
          fi
          # Labels are read now, not from the event, so re-running this job
          # after the Owner sets the label sees it.
          PR_LABELS="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" --jq '[.labels[].name]')"
          export PR_LABELS
          python3 "$gate" --repo head --base "$BASE_SHA" --head "$HEAD_SHA"
